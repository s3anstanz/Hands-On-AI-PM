# Illustrative next-token odds. Weights are relative; they're normalized at load.
# Add your own: copy a [[prompt]] block. Needs 3+ candidates with positive weights.
# Chains (continuation) must have one clear top candidate at every step, should give
# Chapter 1's demo 5-8 steps in total, and shouldn't reuse a prompt the Learn screens
# show (like "The sky is"), or the demo's guesses are given away.

[[prompt]]
text = "The sky is"
tag = "everyday"
tokens = { "blue" = 62, "clear" = 18, "dark" = 12, "gray" = 6, "ugly" = 2 }

[[prompt]]
text = "Thank you so much for"
tag = "everyday"
tokens = { "your" = 40, "the" = 30, "everything" = 15, "coming" = 10, "nothing" = 5 }
continuation = [
  { "help" = 50, "time" = 25, "support" = 15, "patience" = 10 },
  { "with" = 42, "." = 30, "today" = 16, "!" = 12 },
  { "the" = 48, "this" = 30, "my" = 14, "our" = 8 },
  { "project" = 40, "move" = 25, "launch" = 20, "report" = 15 },
  { "." = 62, "!" = 20, "today" = 12, "," = 6 },
]

