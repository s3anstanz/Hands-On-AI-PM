# Chapter 4: prompts whose most likely answer is wrong until the prompt gets the fact.
# Illustrative odds, like prompts.toml. Weights are relative; they're normalized at load.
# Add your own: copy a [[case]] block. Rules (checked at load):
#   tag is "general", "product" or "medical" (keep at least one medical case and one other)
#   answer is a candidate in both tables, and each table has at least 3 candidates
#   without: a wrong answer is the single most likely candidate
#   with_context: the answer is the single most likely candidate, with at least half the odds
# Don't reuse a prompt in a Learn screen, or the chapter's predictions are given away.

[[case]]
prompt = "The capital of Australia is"
tag = "general"
answer = "Canberra"
without = { "Sydney" = 48, "Canberra" = 41, "Melbourne" = 9, "Perth" = 2 }
context = "Reference: Canberra is the capital of Australia; Sydney is its largest city."
with_context = { "Canberra" = 94, "Sydney" = 4, "Melbourne" = 2 }

[[case]]
prompt = "The largest desert on Earth is the"
tag = "general"
answer = "Antarctic"
without = { "Sahara" = 55, "Antarctic" = 25, "Arabian" = 12, "Gobi" = 8 }
context = "Reference: the Antarctic is the largest desert; the Sahara is the largest hot desert."
with_context = { "Antarctic" = 90, "Sahara" = 8, "Arabian" = 2 }

[[case]]
prompt = "Measured from its base on the sea floor to its peak, the tallest mountain is"
tag = "general"
answer = "Mauna Kea"
without = { "Everest" = 58, "Mauna Kea" = 30, "K2" = 8, "Denali" = 4 }
context = "Reference: Mauna Kea rises about 10,200 m from its base on the sea floor; Everest is highest above sea level."
with_context = { "Mauna Kea" = 91, "Everest" = 7, "K2" = 2 }

[[case]]
prompt = "Acme's refund window is"
tag = "product"
answer = "14 days"
without = { "30 days" = 52, "14 days" = 22, "60 days" = 14, "90 days" = 12 }
context = "Acme policy: refunds are accepted within 14 days of delivery."
with_context = { "14 days" = 93, "30 days" = 5, "60 days" = 2 }

[[case]]
prompt = "Patient is allergic to"
tag = "medical"
answer = "sulfa drugs"
without = { "penicillin" = 45, "peanuts" = 20, "latex" = 12, "shellfish" = 10, "sulfa drugs" = 8, "aspirin" = 5 }
context = "Chart: allergic to sulfa drugs."
with_context = { "sulfa drugs" = 90, "penicillin" = 6, "peanuts" = 2, "latex" = 2 }

[[case]]
prompt = "The patient's blood type is"
tag = "medical"
answer = "AB negative"
without = { "O positive" = 38, "A positive" = 32, "B positive" = 12, "O negative" = 10, "AB negative" = 3 }
context = "Chart: blood type AB negative."
with_context = { "AB negative" = 92, "O positive" = 5, "A positive" = 3 }
