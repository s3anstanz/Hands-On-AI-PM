name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: catch newly published vulnerabilities in unchanged deps
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.6"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint, format, types, lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: requirements*.txt match uv.lock
        run: |
          ./scripts/sync-requirements.sh
          if ! git diff --exit-code -- uv.lock 'requirements*.txt'; then
            echo "::error::requirements*.txt are out of date with uv.lock. Run scripts/sync-requirements.sh and commit."
            exit 1
          fi
      - name: Lint workflows (actionlint)
        run: uvx --from actionlint-py==1.7.12.25 actionlint

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"] # oldest supported + newest; 3.11 has caught real bugs 3.14 hides
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras
      - name: Pytest with coverage (fails under 95%)
        run: uv run pytest --cov --cov-report=term

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # linux_x64 tarball
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Install gitleaks (checksum-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
      - name: Scan git history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .
      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit==2.10.1 --disable-pip --require-hashes -r requirements-dev.txt
