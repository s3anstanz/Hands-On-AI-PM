[project]
name = "hands-on-ai-pm"
version = "0.1.0"
description = "Hands-on AI training for product managers, in your terminal."
requires-python = ">=3.11"
dependencies = [
    "rich>=15",
    "tiktoken>=0.14",
]

[project.optional-dependencies]
# Optional live mode (Claude grading, official token counts). Imported lazily.
live = ["anthropic>=1.0,<2"]

[dependency-groups]
dev = [
    "anthropic>=1.0,<2",
    "mypy>=1.18",
    "pre-commit>=4",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff==0.17.0",
]

[tool.uv]
# Flat modules run with `python tutorial.py`; there is nothing to build or install.
package = false

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".superpowers", "docs"]  # docs are records; ruff would reformat their code blocks

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "E501",  # the formatter owns line length; long lines left are lesson prose
    "S311",  # random is for seeded, reproducible teaching runs, not security
]
allowed-confusables = ["×"]  # "15×" is a deliberate multiplication sign in the UI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest uses assert
"tests/test_makefile.py" = ["S603"]  # runs make with the test's own fixed arguments, not user input

[tool.mypy]
python_version = "3.11"
files = ["*.py", "lessons", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
